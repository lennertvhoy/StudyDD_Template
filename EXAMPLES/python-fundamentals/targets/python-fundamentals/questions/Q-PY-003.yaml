public_prompt: |
  This code builds a list of unique words from a large file. Identify the
  performance problem and rewrite it idiomatically.

  ```python
  def unique_words(filename):
      words = []
      with open(filename) as f:
          for line in f:
              for w in line.split():
                  if w not in words:
                      words.append(w)
      return words
  ```
private_answer_key: |
  The algorithm becomes quadratic because each membership check scans a growing list.
  Accumulate into a set instead, whose average membership lookup is constant time.
  An idiomatic solution uses a set comprehension while continuing to stream the input.
rubric:
  - Identifies O(n^2) list membership as the problem
  - Replaces list with set for O(1) lookup
  - Writes idiomatic set comprehension or generator-based solution
  - Considers memory: streaming line-by-line is fine
common_traps:
  - Fixing only dedup but keeping a list (still O(n^2))
  - Not recognizing that `in` on a list is O(n)
  - Reading entire file into memory instead of streaming
